<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ROBO RUSH — Polished Build</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body{height:100%;margin:0;background:#071020;overflow:hidden;font-family:system-ui,monospace;color:#bfe}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;border:10px solid #041018;box-shadow:0 14px 40px rgba(0,0,0,.7);background:#001018}
  .overlay{position:fixed;left:18px;top:18px;color:#9be;pointer-events:none;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width=384 height=216></canvas></div>
<div class="overlay" id="overlay"></div>
<script>
/* =========================
   ROBO RUSH — Polished Version
   Single-file game (HTML/CSS/JS)
   Features improved movement, visuals, polish
   ========================= */

/* ---------- Canvas & Scaling ---------- */
const W=384, H=216;
const canvas=document.getElementById('screen'), ctx=canvas.getContext('2d');
let scale=1;
function resize(){
  const mx=innerWidth-40, my=innerHeight-40;
  const s=Math.min(Math.floor(mx/W), Math.floor(my/H)) || 1;
  scale=s; canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}
addEventListener('resize', resize); resize();

/* ---------- Helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a=0,b=1)=>a + Math.random()*(b-a);
const now=()=>performance.now();
let last = now();
function dt(){const n=now(); const d=(n-last)/1000; last=n; return clamp(d,0,1/30);}

/* ---------- Input (keyboard + basic gamepad) ---------- */
const Keys = {};
const map = {
  ArrowLeft:'left', a:'left', A:'left',
  ArrowRight:'right', d:'right', D:'right',
  ArrowUp:'jump', w:'jump', W:'jump', ' ':'jump',
  j:'shoot', J:'shoot', z:'shoot', Z:'shoot',
  k:'dash', K:'dash', x:'dash', X:'dash',
  Escape:'pause', Enter:'enter', r:'restart',
  '1':'w1','2':'w2','3':'w3','4':'w4','5':'w5', m:'mute'
};
addEventListener('keydown',e=>{
  const k = map[e.key];
  if(k) { Keys[k]=true; e.preventDefault(); }
});
addEventListener('keyup',e=>{
  const k = map[e.key];
  if(k) Keys[k]=false;
});
function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const p = pads[0];
  if(p){
    Keys.left = Keys.left || p.axes[0] < -0.4 || p.buttons[14]?.pressed;
    Keys.right = Keys.right || p.axes[0] > 0.4 || p.buttons[15]?.pressed;
    Keys.jump = Keys.jump || p.buttons[0]?.pressed;
    Keys.shoot = Keys.shoot || p.buttons[2]?.pressed;
    Keys.dash = Keys.dash || p.buttons[1]?.pressed;
    if(p.buttons[9]?.pressed) Keys.pause = true;
  }
}

/* ---------- Audio (tiny retro synth) ---------- */
const Audio = (function(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.connect(ctx.destination); master.gain.value=0.7;
  function s(freq, type='sine', dur=0.12, vol=0.4){
    if(!Audio.enabled) return; const o = ctx.createOscillator(), g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(master);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur); o.stop(ctx.currentTime + dur + 0.02);
  }
  function noise(vol=0.3,dur=0.12){
    if(!Audio.enabled) return; const buffer = ctx.createBuffer(1, dur*ctx.sampleRate, ctx.sampleRate);
    const data = buffer.getChannelData(0); for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/data.length,2);
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buffer; g.gain.value=vol; src.connect(g); g.connect(master); src.start(); src.stop(ctx.currentTime + dur + 0.02);
  }
  let enabled=true; return {
    sfx(name){
      if(!enabled) return;
      switch(name){
        case 'jump': s(440,'triangle',0.18,0.25); s(880,'sine',0.08,0.12); break;
        case 'shoot': s(1200,'sawtooth',0.04,0.18); break;
        case 'charge': s(220,'sine',0.18,0.18); break;
        case 'dash': noise(0.18,0.06); s(700,'sawtooth',0.08,0.2); break;
        case 'hit': noise(0.25,0.08); s(220,'sine',0.06,0.16); break;
        case 'explode': noise(0.6,0.28); s(120,'sawtooth',0.4,0.4); break;
        case 'pickup': s(1500,'triangle',0.12,0.28); break;
        case 'menu': s(880,'sine',0.08,0.14); break;
        case 'boss': s(110,'sine',0.3,0.36); break;
        default: s(600,'sine',0.04,0.1);
      }
    },
    toggle(){ enabled=!enabled; Audio.enabled = enabled; localStorage.setItem('rr_mute', JSON.stringify(!enabled)); },
    init(){ const m = JSON.parse(localStorage.getItem('rr_mute')); if(m) { enabled=false; } Audio.enabled = enabled; }
  };
})();
Audio.init();

/* ---------- Save System ---------- */
const Save = {
  key:'roborush_v2',
  data:{stages:[],gear:0,unlocked:{1:true},upgrades:{},best:{}},
  load(){ try{ const s=JSON.parse(localStorage.getItem(this.key)); if(s) this.data=s; }catch(e){} },
  save(){ localStorage.setItem(this.key, JSON.stringify(this.data)); },
  reset(){ if(confirm('Reset all saved data?')){ localStorage.removeItem(this.key); location.reload(); } }
};
Save.load();

/* ---------- Particles ---------- */
const Particles=[];
function spawn(x,y,n,cols,spread=1,spd=1){
  for(let i=0;i<n;i++){
    Particles.push({
      x,y,vx:rand(-spread,spread)*spd, vy:rand(-spread*1.2,spread)*spd - (Math.random()*1.2),
      life:rand(30,90), age:0, c:cols[Math.floor(Math.random()*cols.length)], s:rand(1,3)
    });
  }
}
function updateParticles(dt){
  for(let i=Particles.length-1;i>=0;i--){
    const p=Particles[i]; p.age+=dt*60; p.vy += 0.12*dt*60; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
    if(p.age>p.life) Particles.splice(i,1);
  }
}
function drawParticles(sx,sy){
  for(const p of Particles){
    ctx.globalAlpha = 1 - (p.age/p.life);
    ctx.fillStyle=p.c; ctx.fillRect(Math.round(p.x-sx), Math.round(p.y-sy), p.s, p.s);
  }
  ctx.globalAlpha=1;
}

/* ---------- Camera ---------- */
const Camera = {x:0,y:0,shake:0};
function camFollow(target,dt,level){
  const look = target.vx*12;
  const tx = clamp(target.x + target.w/2 - W/2 + look, 0, level.width - W);
  const ty = clamp(target.y + target.h/2 - H/2, 0, level.height - H);
  Camera.x += (tx - Camera.x) * clamp(8*dt, 0, 1);
  Camera.y += (ty - Camera.y) * clamp(8*dt, 0, 1);
  if(Camera.shake>0) Camera.shake = Math.max(0, Camera.shake - dt*40);
}
function applyCamera(){
  if(Camera.shake>0){
    ctx.translate(rand(-Camera.shake,Camera.shake), rand(-Camera.shake,Camera.shake));
  }
}

/* ---------- Level & Stage Data ---------- */
const STAGES=[
  {id:0,name:'Neon City',w:2600,h:420,bg:['#071026','#0b1b34','#13294d'],boss:'Volt Titan'},
  {id:1,name:'Jungle Factory',w:2800,h:540,bg:['#041a0d','#08331b','#0a4527'],boss:'Thorn Crusher'},
  {id:2,name:'Ice Core',w:2400,h:760,bg:['#07101a','#0c1a26','#123343'],boss:'Frost Machine'},
  {id:3,name:'Volcanic Forge',w:3000,h:640,bg:['#2b0a06','#3a1208','#4a1708'],boss:'Inferno Gear'},
  {id:4,name:'Omega Citadel',w:3400,h:980,bg:['#050405','#0a0a0a','#101014'],boss:'Omega Core'}
];

/* ---------- World containers ---------- */
let level = null;
let PLAT=[], HAZ=[], ENEMIES=[], PROJ=[], CHECK=[], BOSS=null;

/* ---------- Player (Bolt) ---------- */
const Bolt = {
  x:60,y:0,w:16,h:20,vx:0,vy:0,dir:1,onGround:false,canDouble:true,
  hp:100,maxHp:100,lives:3,inv:0, dash:0, dashCD:0, shootCD:0, charge:0,
  score:0,weapon:1,energy:{1:999,2:80,3:80,4:80,5:80},
  respawn(){ this.x = level.spawn.x; this.y = level.spawn.y; this.vx=0; this.vy=0; this.inv=0; this.hp=this.maxHp; this.dash=0; this.dashCD=0; },
  damage(d,knock= -3){
    if(this.inv>0) return; this.hp -= d; this.inv = 60; Audio.sfx('hit'); Camera.shake = 8; spawn(this.x+this.w/2, this.y+this.h/2, 24, ['#ff6644','#ff2244','#ffc040'],2,1.6);
    this.vx = knock; this.vy = -4;
    if(this.hp<=0) this.killed();
  },
  killed(){
    Audio.sfx('explode'); spawn(this.x+this.w/2,this.y+this.h/2,80,['#ffcc66','#ff8844','#fff'],4,3);
    this.lives--; if(this.lives<0){ Game.mode='gameover'; } else { this.respawn(); }
  }
};

/* ---------- Physics & Collisions ---------- */
function solidAt(rx,ry,rw,rh){
  for(const p of PLAT) if(rx < p.x + p.w && rx + rw > p.x && ry < p.y + p.h && ry + rh > p.y) return p;
  return null;
}
function oneWayAt(rx,ry,rw,rh){
  // treat platforms with oneWay:true as pass-through from below
  for(const p of PLAT) if(p.oneWay && rx < p.x + p.w && rx + rw > p.x && ry < p.y + p.h && ry + rh > p.y) return p;
  return null;
}
function clampWorld(e){
  e.x = clamp(e.x, 0, level.width - e.w);
  e.y = clamp(e.y, 0, level.height - e.h);
}

/* ---------- Movement: tight controls ---------- */
function updateBolt(dt){
  // inputs
  pollGamepad();
  const L = Keys.left, R = Keys.right, J = Keys.jump, S = Keys.shoot, D = Keys.dash;
  // horizontal acceleration
  const accAir = 0.18, accGround = 0.7;
  const friction = Bolt.onGround ? 0.8 : 0.985;
  if(L) Bolt.vx -= (Bolt.onGround?accGround:accAir) * dt*120;
  if(R) Bolt.vx += (Bolt.onGround?accGround:accAir) * dt*120;
  Bolt.vx *= friction;
  Bolt.vx = clamp(Bolt.vx, -5.2, 5.2);
  Bolt.dir = Bolt.vx > 0.1 ? 1 : Bolt.vx < -0.1 ? -1 : Bolt.dir;
  // jump (variable)
  if(J && Bolt.onGround){ Bolt.vy = -5.4; Bolt.onGround=false; Bolt.canDouble = true; Audio.sfx('jump'); }
  else if(J && Bolt.canDouble && !Bolt.onGround && !Bolt._doubleUsed && Save.data.upgrades && Save.data.upgrades.doubleJump){
    // double jump if upgrade
    Bolt.vy = -4.6; Bolt._doubleUsed = true; Audio.sfx('jump'); spawn(Bolt.x+Bolt.w/2,Bolt.y+Bolt.h/2,12,['#9ef','#9cf'],1.8,1.6);
  }
  if(!J) Bolt._doubleUsed = false;
  // gravity
  Bolt.vy += 0.28 * dt*120;
  Bolt.vy = clamp(Bolt.vy, -10, 12);
  // dash
  if(D && Bolt.dashCD <= 0){
    Bolt.dash = 12; Bolt.dashCD = 90; Audio.sfx('dash'); Camera.shake = 6;
  }
  if(Bolt.dash > 0){
    Bolt.dash -= dt*60;
    Bolt.vx = Bolt.dir * 8; Bolt.vy *= 0.9;
    // dash trail
    spawn(Bolt.x + Bolt.w/2, Bolt.y + Bolt.h/2, 1, ['#7ff','#4fd'],0.6,0.6);
  } else {
    Bolt.dash = 0;
    Bolt.dashCD = Math.max(0, Bolt.dashCD - dt*60);
  }
  // shooting & charging
  if(S){
    Bolt.charge += dt*60;
    if(Bolt.charge > 130 && Bolt.shootCD <= 0){ // big blast
      shootBolt(3); Bolt.shootCD = 20; Bolt.charge = 0; Audio.sfx('charge'); Camera.shake = 8;
    } else if(Bolt.charge > 55 && Bolt.shootCD <= 0){
      shootBolt(2); Bolt.shootCD = 12; Bolt.charge = 0; Audio.sfx('charge');
    } else if(Bolt.shootCD <= 0){
      shootBolt(1); Bolt.shootCD = 8;
    }
  } else {
    Bolt.charge = Math.max(0, Bolt.charge - dt*20);
  }
  if(Bolt.shootCD > 0) Bolt.shootCD -= dt*60;
  if(Bolt.inv>0) Bolt.inv -= dt*60;
  // apply velocity & collisions
  // horizontal move and wall collision
  Bolt.x += Bolt.vx * dt*60;
  let s = solidAt(Bolt.x, Bolt.y, Bolt.w, Bolt.h);
  if(s){
    if(Bolt.vx > 0) Bolt.x = s.x - Bolt.w - 0.01;
    else if(Bolt.vx < 0) Bolt.x = s.x + s.w + 0.01;
    Bolt.vx = 0;
  }
  // vertical
  Bolt.y += Bolt.vy * dt*60;
  // one-way platforms: only collide if falling
  Bolt.onGround = false;
  // check one-way platforms first
  for(const p of PLAT){
    if(Bolt.x < p.x + p.w && Bolt.x + Bolt.w > p.x){
      if(p.oneWay){
        // if Bolt was above and is falling into it
        if(Bolt.y + Bolt.h > p.y && Bolt.y + Bolt.h - Bolt.vy * dt*60 <= p.y && Bolt.vy >= 0){
          Bolt.y = p.y - Bolt.h; Bolt.vy = 0; Bolt.onGround = true;
        }
      } else {
        if(Bolt.y < p.y + p.h && Bolt.y + Bolt.h > p.y){
          // resolve vertical penetration
          if(Bolt.vy > 0){ Bolt.y = p.y - Bolt.h; Bolt.vy = 0; Bolt.onGround = true; }
          else if(Bolt.vy < 0){ Bolt.y = p.y + p.h; Bolt.vy = 0; }
        }
      }
    }
  }
  // world bounds
  if(Bolt.y > level.height + 100){ // fell in pit
    Bolt.killed();
  }
  // checkpoints
  for(const c of CHECK) if(!c.active && Bolt.x + Bolt.w/2 > c.x && Bolt.x + Bolt.w/2 < c.x + 48){
    c.active = true; level.spawn = {x:c.x + 8, y:c.y - 28}; Bolt.hp = Math.min(Bolt.maxHp, Bolt.hp + 25); Audio.sfx('pickup');
  }
}

/* ---------- Shooting ---------- */
function shootBolt(power){
  const dir = Bolt.dir;
  const base = {x:Bolt.x + Bolt.w/2 + (dir>0?8:-8), y:Bolt.y + 8};
  let p = {x:base.x, y:base.y, vx:dir*(6 + power*1.6), vy:0, w:6 + power*2, h:6 + power*2, life:140, dmg:6 + power*4, owner:'player', col:power===3? '#aef' : power===2? '#7ff' : '#9cf'};
  // weapon variants (simplified)
  if(Bolt.weapon===2){ p.col='#7fffe5'; p.dmg += 4; p.w += 2; } // Volt Blade flavor
  if(Bolt.weapon===3){ p.col='#8fe65a'; p.dmg += 2; } // Thorn
  if(Bolt.weapon===4){ p.col='#cfefff'; p.dmg += 2; } // Ice
  if(Bolt.weapon===5){ p.col='#ffb366'; p.dmg += 6; } // Fire
  PROJ.push(p); Audio.sfx('shoot'); spawn(p.x,p.y,6,['#9cf','#7ff','#dff'],0.6,0.8);
}

/* ---------- Enemies (simple set) ---------- */
function spawnEnemy(type,x,y){
  const e = {id:Math.random(), type, x,y, w:18, h:18, vx:0, vy:0, hp: type==='turret'?18:12, maxHp:20, aiTimer:0, dir: -1};
  ENEMIES.push(e);
}
function updateEnemies(dt){
  for(let i=ENEMIES.length-1;i>=0;i--){
    const e = ENEMIES[i];
    e.aiTimer += dt*60;
    if(e.type==='walker'){
      if(!e.patrolDir) e.patrolDir = Math.random()<0.5? -1:1;
      e.vx = e.patrolDir * 0.9;
      e.x += e.vx * dt*60;
      // simple edge flip
      const under = PLAT.find(p=> e.x+e.w>p.x && e.x<p.x+p.w && e.y+e.h === p.y);
      if(!under) e.patrolDir *= -1;
      // collision with player
      if(rect(e,Bolt) && Bolt.inv<=0){ Bolt.damage(8, e.x < Bolt.x ? -4 : 4); }
    } else if(e.type==='turret'){
      if(Math.floor(e.aiTimer)%80===0){
        const dx = Bolt.x - e.x, dy = Bolt.y - e.y;
        const ang = Math.atan2(dy, dx);
        PROJ.push({x:e.x,y:e.y, vx:Math.cos(ang)*4, vy:Math.sin(ang)*4, w:8, h:8, life:140, dmg:8, owner:'enemy', col:'#f66'});
      }
    } else if(e.type==='fly'){
      e.vx = Math.sin(e.aiTimer/20)*1.2;
      e.vy = Math.sin(now()/600 + e.x)*0.6;
      e.x += e.vx * dt*60; e.y += e.vy * dt*60;
      if(rect(e,Bolt) && Bolt.inv<=0){ Bolt.damage(9, e.x < Bolt.x ? -4 : 4); ENEMIES.splice(i,1); spawn(e.x,e.y,'explode'); }
    }
    // keep in world
    clampWorld(e);
  }
}

/* ---------- Boss (example behaviors) ---------- */
function spawnBossForStage(st){
  const s = STAGES[st];
  const b = {name:s.boss, x: s.w - 300, y: s.h - 200, w:96, h:96, hp: (st===4?800:300), maxHp:(st===4?800:300), phase:1, timer:0, alive:true};
  BOSS = b; return b;
}
function updateBoss(dt){
  if(!BOSS || !BOSS.alive) return;
  BOSS.timer += dt*60;
  const b = BOSS;
  if(b.hp < b.maxHp*0.66) b.phase=2;
  if(b.hp < b.maxHp*0.33) b.phase=3;
  // basic attack patterns
  if(b.phase===1){
    if(Math.floor(b.timer)%50===0){
      PROJ.push({x:b.x,y:b.y+40, vx:-5, vy:rand(-1.5,1.5), w:10,h:10,life:200,dmg:10,owner:'boss',col:'#7ff'});
      Audio.sfx('boss');
    }
  } else if(b.phase===2){
    if(Math.floor(b.timer)%28===0){
      PROJ.push({x:b.x,y:b.y+20, vx:-7, vy:rand(-2,2), w:12,h:12,life:200,dmg:14,owner:'boss',col:'#f7a'});
      Audio.sfx('boss');
    }
  } else {
    // phase 3 barrage
    if(Math.floor(b.timer)%12===0){
      for(let i=0;i<3;i++) PROJ.push({x:b.x,y:b.y+10+i*18, vx:-9, vy:rand(-3,3), w:10,h:10,life:140,dmg:18,owner:'boss',col:'#fff'});
      Audio.sfx('explode');
      Camera.shake = 6;
    }
  }
  // collision with player
  if(rect(b,Bolt) && Bolt.inv<=0){ Bolt.damage(18, b.x < Bolt.x ? -6 : 6); }
}

/* ---------- Projectiles ---------- */
function updateProjectiles(dt){
  for(let i=PROJ.length-1;i>=0;i--){
    const p = PROJ[i];
    p.x += p.vx * dt*60; p.y += p.vy * dt*60; p.life--; if(p.life<=0) { PROJ.splice(i,1); continue; }
    // if owner player, hit enemies
    if(p.owner==='player'){
      for(let j=ENEMIES.length-1;j>=0;j--){
        if(rect(p,ENEMIES[j])){
          ENEMIES[j].hp -= p.dmg; spawn(ENEMIES[j].x+ENEMIES[j].w/2, ENEMIES[j].y+ENEMIES[j].h/2, 8, ['#ff8844','#ffcc66']);
          Audio.sfx('hit'); if(ENEMIES[j].hp<=0) { spawn(ENEMIES[j].x,ENEMIES[j].y,20,['#ffcc66','#ff8844']); ENEMIES.splice(j,1); Bolt.score += 200; }
          PROJ.splice(i,1); break;
        }
      }
      if(BOSS && BOSS.alive && rect(p,BOSS)){ BOSS.hp -= p.dmg; PROJ.splice(i,1); Audio.sfx('hit'); Bolt.score += 25; if(BOSS.hp<=0){ BOSS.alive=false; Audio.sfx('explode'); spawn(BOSS.x+BOSS.w/2,BOSS.y+BOSS.h/2,200,['#fff','#ff8','#f55'],4,4); Save.data.stages.push(level.id); Save.save(); } }
    } else {
      // enemy or boss projectiles hitting player
      if(rect(p,Bolt) && Bolt.inv<=0){
        Bolt.damage(p.dmg, p.vx>0?-6:6); PROJ.splice(i,1);
      }
    }
  }
}

/* ---------- Collision helper ---------- */
function rect(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

/* ---------- Level builder (populate platforms/enemies/checkpoints) ---------- */
function buildLevel(idx){
  const s = STAGES[idx]; level = {id:idx, name:s.name, width:s.w, height:s.h, bg:s.bg, spawn:{x:60,y:s.h-120}};
  PLAT = []; HAZ = []; ENEMIES = []; PROJ = []; CHECK = []; Particles.length=0; BOSS=null;
  // ground
  for(let x=0;x<s.w;x+=64) PLAT.push({x:x,y:s.h-40,w:64,h:40});
  // theme-based platforms & enemies
  if(idx===0){
    for(let x=150;x<s.w-600;x+=240){
      PLAT.push({x:x,y:s.h-120,w:96,h:12});
      spawnEnemy('walker', x+16, s.h-140);
      if(x%480===150) spawnEnemy('turret', x+56, s.h-160);
    }
    for(let p=600;p<s.w-400;p+=480) HAZ.push({x:p,y:s.h-40,w:100,h:40,type:'pit'});
  } else if(idx===1){
    for(let x=200;x<s.w-600;x+=220){
      PLAT.push({x:x,y:s.h-160-(x%220),w:110,h:12, oneWay:true});
      spawnEnemy('fly', x+12, s.h-200-(x%220));
    }
  } else if(idx===2){
    for(let x=160;x<s.w-480;x+=180){
      PLAT.push({x:x,y:120+(x%260),w:76,h:12,ice:true, oneWay:true});
      spawnEnemy('walker', x+4, 120+(x%260)-22);
      if(x%360===160) spawnEnemy('sniper', x+10, 120+(x%260)-40);
    }
  } else if(idx===3){
    for(let x=180;x<s.w-500;x+=140){
      PLAT.push({x:x,y:s.h-140 + ((x/140)%3)*28,w:100,h:12});
      if(x%420===180) spawnEnemy('exploder', x+12, s.h-170);
    }
  } else {
    for(let x=160;x<s.w-800;x+=140){
      PLAT.push({x:x,y:80 + (x%320),w:76,h:12});
      spawnEnemy('sniper', x+8,80+(x%320)-10);
    }
  }
  // checkpoints
  for(let i=400;i<s.w;i+=700) CHECK.push({x:i,y:s.h-120,active:false});
  // boss at near end
  spawnBossForStage(idx);
  return level;
}

/* ---------- UI: HUD, Menus ---------- */
let Game = {mode:'menu', paused:false};
const overlay = document.getElementById('overlay');
function drawHUD(){
  // top-left panel
  ctx.fillStyle='rgba(0,0,0,0.5)'; roundRect(ctx,8,8,180,46,6,true);
  ctx.fillStyle='#9be'; ctx.font='10px monospace'; ctx.fillText(`${level?level.name:'ROBO RUSH'}`,16,20);
  // HP bar
  ctx.fillStyle='#222'; ctx.fillRect(16,26,140,10);
  ctx.fillStyle='#f55'; ctx.fillRect(16,26, Math.round(140 * (Bolt.hp/Bolt.maxHp)),10);
  ctx.strokeStyle='#000'; ctx.strokeRect(16,26,140,10);
  ctx.fillStyle='#9be'; ctx.fillText(`HP ${Math.max(0,Math.floor(Bolt.hp))}/${Bolt.maxHp}`, 162, 34);
  // weapon & score
  ctx.fillStyle='#9be'; ctx.fillText(`W:${Bolt.weapon}  Score:${Bolt.score}`, 200, 20);
  // charge indicator
  if(Bolt.charge>0){
    const pct = clamp(Bolt.charge/130,0,1);
    ctx.fillStyle=`rgba(160,255,255,${0.18 + pct*0.4})`;
    ctx.fillRect(16,40, Math.round(140*pct),4);
  }
}
function roundRect(ctx,x,y,w,h,r,fill){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); if(fill) ctx.fill(); else ctx.stroke();
}
function drawMenu(){
  ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(ctx,64,48,256,120,8,true);
  ctx.fillStyle='#9be'; ctx.font='18px monospace'; ctx.fillText('ROBO RUSH', 150, 82);
  ctx.font='12px monospace'; ctx.fillStyle='#dfe'; ctx.fillText('Enter: Start   S: Stage Select   U: Upgrades   M: Mute', 92, 108);
  ctx.fillStyle='#9be'; ctx.fillText('Controls: A/Left D/Right  W/Space Up to jump  J to shoot  K to dash', 70, 132);
  if(Keys.enter){ startStage(0); Keys.enter=false; }
  if(Keys.w1 || Keys.w2 || Keys.w3 || Keys.w4 || Keys.w5){} // ignore here
}
function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; roundRect(ctx,90,72,204,68,6,true);
  ctx.fillStyle='#fff'; ctx.font='14px monospace'; ctx.fillText('PAUSED', 166, 98);
  ctx.font='11px monospace'; ctx.fillStyle='#9be'; ctx.fillText('Esc: Resume  R: Restart checkpoint  M: Toggle sound', 108, 120);
}

/* ---------- Rendering ---------- */
function drawScene(){
  // clear
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  // background parallax
  if(level){
    ctx.fillStyle = level.bg[0]; ctx.fillRect(0,0,W,H);
    drawParallax(level);
  } else {
    // title BG
    ctx.fillStyle='#001028'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){ ctx.fillStyle=`rgba(20,150,200,${0.02})`; ctx.fillRect((i*53)%W,20 + Math.sin(i+now()/800)*20, 28, 18 + (i%6)); }
  }
  ctx.save();
  ctx.translate(-Math.round(Camera.x), -Math.round(Camera.y));
  applyCamera();
  // platforms
  for(const p of PLAT){
    ctx.fillStyle = p.ice ? '#88c' : p.oneWay ? '#3b3' : '#444';
    roundRect(ctx, p.x, p.y, p.w, p.h, 3, true);
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.strokeRect(p.x,p.y,p.w,p.h);
  }
  // hazards
  for(const h of HAZ){
    ctx.fillStyle = h.type==='lava' ? '#ff6a00' : '#880000';
    ctx.fillRect(h.x,h.y,h.w,h.h);
  }
  // checkpoints
  for(const c of CHECK){
    ctx.fillStyle = c.active ? '#7fffa0' : '#6b6b6b';
    ctx.fillRect(c.x, c.y-6, 36, 6);
    ctx.fillStyle='#222'; ctx.fillRect(c.x+12, c.y-2, 12, 4);
  }
  // enemies
  for(const e of ENEMIES) drawEnemy(e);
  // boss
  if(BOSS && BOSS.alive) drawBoss(BOSS);
  // projectiles
  for(const p of PROJ){ ctx.fillStyle = p.col || '#fff'; ctx.fillRect(p.x, p.y, p.w, p.h); }
  // particles
  drawParticles(Camera.x, Camera.y);
  // player
  drawBolt();
  ctx.restore();
  // HUD / UI
  drawHUD();
  if(Game.mode==='menu') drawMenu();
  if(Game.paused) drawPause();
  if(Game.mode==='stageclear'){
    ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(ctx,64,48,256,120,8,true);
    ctx.fillStyle='#9be'; ctx.font='16px monospace'; ctx.fillText('STAGE CLEAR!', 128, 84);
    ctx.font='12px monospace'; ctx.fillStyle='#fff'; ctx.fillText(`Score: ${Bolt.score}`, 150, 108);
    if(Keys.enter){ Game.mode='menu'; Keys.enter=false; }
  }
  if(Game.mode==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f66'; ctx.font='18px monospace'; ctx.fillText('BOLT DESTROYED', 112, 104);
    ctx.font='12px monospace'; ctx.fillStyle='#fff'; ctx.fillText('R to retry stage or Enter for menu', 96,130);
    if(Keys.restart){ startStage(level.id); Keys.restart=false; }
    if(Keys.enter){ Game.mode='menu'; Keys.enter=false; }
  }
}

/* ---------- Draw Helpers: Bolt & Enemies & Boss ---------- */
function drawBolt(){
  const sx = Math.round(Bolt.x - Camera.x), sy = Math.round(Bolt.y - Camera.y);
  ctx.save();
  // subtle bob
  const bob = Math.sin(now()/120)*0.6;
  ctx.translate(sx, sy + bob);
  // cloak shadow
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(2, Bolt.h+2, Bolt.w-4, 4);
  // body
  ctx.fillStyle = Bolt.inv>0 && Math.floor(now()/80)%2? '#fff' : '#1f6de8';
  roundRect(ctx, 0, 0, Bolt.w, Bolt.h, 3, true);
  // visor
  ctx.fillStyle = '#9ef'; ctx.fillRect(3,4,10,6);
  // cannon
  ctx.fillStyle = '#133'; ctx.fillRect(Bolt.dir>0?Bolt.w-2:-6,6,6,5);
  // charge ring/glow
  if(Bolt.charge>8){
    const c = clamp(Bolt.charge/130,0,1);
    ctx.strokeStyle=`rgba(160,255,255,${0.12 + c*0.5})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(Bolt.w/2, Bolt.h/2, 8 + 6*c, 8 + 4*c, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();
  ctx.translate(Math.round(e.x - Camera.x), Math.round(e.y - Camera.y));
  // silhouette
  if(e.type==='turret'){ ctx.fillStyle='#c65'; ctx.fillRect(0,0,e.w,e.h); ctx.fillStyle='#222'; ctx.fillRect(4,6,10,6); }
  else if(e.type==='fly'){ ctx.fillStyle='#7ff'; ctx.beginPath(); ctx.ellipse(8,8,9,6,0,0,Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle='#c64'; roundRect(ctx,0,0,e.w,e.h,3,true); }
  ctx.restore();
}
function drawBoss(b){
  ctx.save();
  ctx.translate(Math.round(b.x - Camera.x), Math.round(b.y - Camera.y));
  ctx.fillStyle='#883355'; roundRect(ctx,0,0,b.w,b.h,8,true);
  // eyes
  ctx.fillStyle='#fff'; ctx.fillRect(12,18,8,6); ctx.fillRect(b.w-22,18,8,6);
  ctx.restore();
  // boss health bar
  const bw = Math.round((b.hp/b.maxHp) * (W - 40));
  ctx.fillStyle='#222'; ctx.fillRect(20,12,W-40,10);
  ctx.fillStyle='#f55'; ctx.fillRect(22,14,bw-4,6);
  ctx.strokeStyle='#000'; ctx.strokeRect(20,12,W-40,10);
}

/* ---------- Parallax background ---------- */
function drawParallax(level){
  const sx = Camera.x;
  // far
  for(let i=0;i<12;i++){
    ctx.fillStyle = mix(level.bg[0], level.bg[1], 0.06 + Math.sin(now()/200 + i)*0.02);
    const x = (i*173 - sx*0.12) % (W+160) - 80;
    ctx.fillRect(x, 20, 140, 26 + (i%3)*8);
  }
  // mid
  for(let i=0;i<10;i++){
    ctx.fillStyle = mix(level.bg[1], level.bg[2], 0.1 + (i%2)*0.05);
    const x = (i*243 - sx*0.28) % (W+240) - 120;
    ctx.fillRect(x, 60 + (i%4)*8, 220, 28);
  }
}
function mix(a,b,t){
  // a,b are hex strings like '#123456'
  const pa = hexToRgb(a), pb = hexToRgb(b);
  const r=Math.round(pa.r*(1-t)+pb.r*t), g=Math.round(pa.g*(1-t)+pb.g*t), bl=Math.round(pa.b*(1-t)+pb.b*t);
  return `rgb(${r},${g},${bl})`;
}
function hexToRgb(hex){
  hex = hex.replace('#',''); const r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  return {r,g,b};
}

/* ---------- Game Control: start/loop ---------- */
function startStage(idx){
  level = buildLevel(idx);
  Bolt.x = level.spawn.x; Bolt.y = level.spawn.y; Bolt.hp = Bolt.maxHp; Bolt.lives = 3; Bolt.score = 0; Bolt.weapon = 1;
  Game.mode = 'play'; Game.paused = false; Audio.sfx('menu');
}
function buildLevel(idx){ return STAGES[idx] ? buildLevelFromTemplate(idx) : buildLevelFromTemplate(0); }
function buildLevelFromTemplate(idx){
  const s = STAGES[idx]; level = {id:idx, name:s.name, width:s.w, height:s.h, bg:s.bg, spawn:{x:60,y:s.h-120}};
  PLAT=[]; HAZ=[]; ENEMIES=[]; PROJ=[]; CHECK=[]; Particles.length=0;
  // ground
  for(let x=0;x<s.w;x+=64) PLAT.push({x:x,y:s.h-40,w:64,h:40});
  // theme placements (kept from earlier polished version)
  if(idx===0){ for(let x=150;x<s.w-600;x+=220){ PLAT.push({x:x,y:s.h-120,w:96,h:12}); spawnEnemy('walker', x+14, s.h-140); if(x%440===150) spawnEnemy('turret', x+56, s.h-160); } }
  if(idx===1){ for(let x=200;x<s.w-700;x+=200){ PLAT.push({x:x,y:s.h-160-(x%220),w:110,h:12, oneWay:true}); spawnEnemy('fly', x+12, s.h-200-(x%220)); } }
  if(idx===2){ for(let x=160;x<s.w-500;x+=180){ PLAT.push({x:x,y:120+(x%260),w:76,h:12,ice:true,oneWay:true}); spawnEnemy('walker', x+4, 120+(x%260)-22); } }
  if(idx===3){ for(let x=180;x<s.w-500;x+=140){ PLAT.push({x:x,y:s.h-140 + ((x/140)%3)*28,w:100,h:12}); if(x%420===180) spawnEnemy('exploder', x+12, s.h-170); } }
  if(idx===4){ for(let x=160;x<s.w-820;x+=140){ PLAT.push({x:x,y:80 + (x%320),w:76,h:12}); spawnEnemy('sniper', x+8,80+(x%320)-10); } }
  for(let i=400;i<s.w;i+=700) CHECK.push({x:i,y:s.h-120,active:false});
  spawnBossForStage(idx);
  return level;
}

/* ---------- Input reaction for menus ---------- */
addEventListener('keypress', e => {
  if(e.key==='r' || e.key==='R') Keys.restart=true;
  if(e.key==='m' || e.key==='M') Audio.toggle();
  if(['1','2','3','4','5'].includes(e.key)) Bolt.weapon = parseInt(e.key);
});

/* ---------- Main loop ---------- */
let lastFrame=performance.now();
function frame(){
  const d = dt(); // delta seconds
  if(Game.mode==='play' && !Game.paused){
    updateBolt(d);
    updateEnemies(d);
    updateProjectiles(d);
    updateBoss(d);
    updateParticles(d);
    camFollow(Bolt,d,level);
    // check boss defeat
    if(BOSS && !BOSS.alive){ Game.mode='stageclear'; }
  }
  // draw
  drawScene();
  requestAnimationFrame(frame);
}
Game.mode='menu';
frame();

/* ---------- Utility: rectangle rounding for aesthetic ---------- */
/* already defined roundRect above */

/* ---------- Simple UI overlay instructions ---------- */
overlay.innerHTML = `Controls: A/Left D/Right • W/Space Up = Jump • J/Z Shoot (hold to charge) • K/X Dash • 1-5 Switch weapons • Esc Pause • M Toggle audio`;

/* ---------- Initialize Audio toggle & load save ---------- */
Audio.init();
Save.load();

/* ---------- Expose some debug/test controls (not required) ---------- */
window.__RR = { startStage, Save, Audio, Bolt, buildLevel };

/* ---------- End of file ---------- */
</script>
